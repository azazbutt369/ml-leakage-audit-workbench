[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-ml-leakage-workbench"
version = "1.0.0"
description = "Reproducible Tabular ML and Leakage-Audit Workbench for B2B SaaS Customer-Churn Prediction by Azaz Butt"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Azaz Butt", email = "azaz.butt@example.com" }
]
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  "scipy>=1.11.0",
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "pydantic>=2.4.0",
  "streamlit>=1.28.0",
  "plotly>=5.18.0",
  "joblib>=1.3.0",
  "httpx>=0.25.0",
  "python-multipart>=0.0.6",
  "pytest>=7.4.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
